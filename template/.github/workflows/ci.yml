name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.6
      # The harness repo is private. bun hands its git+ssh spec to git, and this rewrites that URL to
      # HTTPS with a read-only token scoped to the factory repo (the HARNESS_TOKEN secret).
      - name: harness access
        id: harness-access
        env:
          HARNESS_TOKEN: ${{ secrets.HARNESS_TOKEN }}
        run: |
          test -n "$HARNESS_TOKEN" || { echo "::error::set the HARNESS_TOKEN repo secret"; exit 1; }
          git config --global url."https://x-access-token:${HARNESS_TOKEN}@github.com/Pierre-Mike/factory".insteadOf "ssh://git@github.com/Pierre-Mike/factory"
      - run: bun install --frozen-lockfile
      - run: bunx axioms check

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.6
      # The harness repo is private. bun hands its git+ssh spec to git, and this rewrites that URL to
      # HTTPS with a read-only token scoped to the factory repo (the HARNESS_TOKEN secret).
      - name: harness access
        id: harness-access
        env:
          HARNESS_TOKEN: ${{ secrets.HARNESS_TOKEN }}
        run: |
          test -n "$HARNESS_TOKEN" || { echo "::error::set the HARNESS_TOKEN repo secret"; exit 1; }
          git config --global url."https://x-access-token:${HARNESS_TOKEN}@github.com/Pierre-Mike/factory".insteadOf "ssh://git@github.com/Pierre-Mike/factory"
      - run: bun install --frozen-lockfile
      - run: bunx axioms smoke

  # Bundles the worker exactly as `wrangler deploy` would and applies every migration to a fresh
  # D1, without a Cloudflare account. A deploy can only break here first.
  deploy-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.6
      # The harness repo is private. bun hands its git+ssh spec to git, and this rewrites that URL to
      # HTTPS with a read-only token scoped to the factory repo (the HARNESS_TOKEN secret).
      - name: harness access
        id: harness-access
        env:
          HARNESS_TOKEN: ${{ secrets.HARNESS_TOKEN }}
        run: |
          test -n "$HARNESS_TOKEN" || { echo "::error::set the HARNESS_TOKEN repo secret"; exit 1; }
          git config --global url."https://x-access-token:${HARNESS_TOKEN}@github.com/Pierre-Mike/factory".insteadOf "ssh://git@github.com/Pierre-Mike/factory"
      - run: bun install --frozen-lockfile
      - run: bunx axioms deploy --dry-run

  # The PR body is the author's contract: every section of .github/PULL_REQUEST_TEMPLATE.md,
  # filled. The step is unconditional, and the command itself passes on runs that carry no pull
  # request (a push, a dry-run replay), so the gate stays reproducible for `axioms ci-dry-run`.
  pr-body:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.6
      # The harness repo is private. bun hands its git+ssh spec to git, and this rewrites that URL to
      # HTTPS with a read-only token scoped to the factory repo (the HARNESS_TOKEN secret).
      - name: harness access
        id: harness-access
        env:
          HARNESS_TOKEN: ${{ secrets.HARNESS_TOKEN }}
        run: |
          test -n "$HARNESS_TOKEN" || { echo "::error::set the HARNESS_TOKEN repo secret"; exit 1; }
          git config --global url."https://x-access-token:${HARNESS_TOKEN}@github.com/Pierre-Mike/factory".insteadOf "ssh://git@github.com/Pierre-Mike/factory"
      - run: bun install --frozen-lockfile
      - run: bunx axioms pr-body

  # actionlint (is the workflow valid) + zizmor (is it safe), at pinned versions.
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.6
      # The harness repo is private. bun hands its git+ssh spec to git, and this rewrites that URL to
      # HTTPS with a read-only token scoped to the factory repo (the HARNESS_TOKEN secret).
      - name: harness access
        id: harness-access
        env:
          HARNESS_TOKEN: ${{ secrets.HARNESS_TOKEN }}
        run: |
          test -n "$HARNESS_TOKEN" || { echo "::error::set the HARNESS_TOKEN repo secret"; exit 1; }
          git config --global url."https://x-access-token:${HARNESS_TOKEN}@github.com/Pierre-Mike/factory".insteadOf "ssh://git@github.com/Pierre-Mike/factory"
      - run: bun install --frozen-lockfile
      - run: bunx axioms lint-workflows

  # gitleaks over the committed history: no secret reaches the remote, at a pinned version.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.6
      # The harness repo is private. bun hands its git+ssh spec to git, and this rewrites that URL to
      # HTTPS with a read-only token scoped to the factory repo (the HARNESS_TOKEN secret).
      - name: harness access
        id: harness-access
        env:
          HARNESS_TOKEN: ${{ secrets.HARNESS_TOKEN }}
        run: |
          test -n "$HARNESS_TOKEN" || { echo "::error::set the HARNESS_TOKEN repo secret"; exit 1; }
          git config --global url."https://x-access-token:${HARNESS_TOKEN}@github.com/Pierre-Mike/factory".insteadOf "ssh://git@github.com/Pierre-Mike/factory"
      - run: bun install --frozen-lockfile
      - run: bunx axioms secret-scan
