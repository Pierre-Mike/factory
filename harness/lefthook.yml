# Shared git hooks. A project's lefthook.yml extends this file; `bunx axioms sync` writes that.

pre-commit:
  piped: true
  jobs:
    - name: biome
      glob: "*.{ts,tsx,js,jsx,json,jsonc}"
      run: bunx axioms biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

commit-msg:
  jobs:
    - name: conventional-commit
      run: bunx axioms commit-msg {1}

pre-push:
  piped: true
  jobs:
    - name: check
      run: bunx axioms check
    # Replays ci.yml on a clean clone when the push touches CI/CD files (workflows, manifests,
    # lockfile, wrangler config, migrations). Other pushes skip it in well under a second.
    - name: ci-dry-run
      run: bunx axioms ci-dry-run
